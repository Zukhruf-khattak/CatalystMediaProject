services:
  db:
    image: pgvector/pgvector:pg16
    container_name: catalist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalist_password}
      POSTGRES_DB: ${POSTGRES_DB:-catalist_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalist_user} -d ${POSTGRES_DB:-catalist_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: catalist-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Catalist Meeting Intelligence}"
      APP_ENV: "${APP_ENV:-development}"
      DEBUG: "${DEBUG:-true}"
      API_V1_PREFIX: "${API_V1_PREFIX:-/api/v1}"
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: 8000
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-catalist_user}:${POSTGRES_PASSWORD:-catalist_password}@db:5432/${POSTGRES_DB:-catalist_db}"
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-false}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-catalist-meeting-intelligence}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      LLM_MODEL: "${LLM_MODEL:-llama3.2}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: catalist-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  postgres_data:
    name: catalist_postgres_data

